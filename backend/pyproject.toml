[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "DJ",  # Django-specific
]
ignore = [
    # The pipeline deliberately catches broad exceptions at each stage boundary:
    # a detector crash or a provider bug must degrade to review, never 500.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"scanner/tests/*" = ["E501"]
