name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A force-push while CI is mid-run should cancel the stale run, not race it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # CI must never need a real key. Every test either mocks the provider or
      # runs in dry-run, so a live call here would be a bug worth failing on.
      VLM_DRY_RUN: "True"
      DETECTOR_BACKEND: opencv
      APP_SHARED_TOKEN: dev-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        # requirements-dev.txt deliberately excludes ultralytics/torch: the
        # detector falls back to OpenCV, which is the path CI should exercise.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Format check
        working-directory: backend
        run: ruff format --check .

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --fail-level WARNING

      - name: Fail if a model change has no migration
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: pytest scanner/tests -q

  app:
    name: Expo app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      # Deterministic and dependency-free, so it cannot fail for reasons
      # unrelated to secrets. Covers the two mistakes that matter here:
      # a tracked .env, or a provider key pasted into a tracked file.
      - name: Guard against tracked credentials
        run: ./scripts/check_no_secrets.sh

      - name: Scan history with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
